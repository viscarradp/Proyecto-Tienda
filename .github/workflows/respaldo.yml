name: Respaldo nocturno

# Respaldo cifrado de la base de datos. Guia: docs/operations/respaldos.md
on:
  schedule:
    - cron: "0 8 * * *" # 08:00 UTC = 02:00 a. m. en El Salvador (UTC-6, sin horario de verano)
  workflow_dispatch:

permissions:
  contents: read

# Version mayor del cliente de Postgres: debe ser >= la del servidor (Supabase).
# Si Supabase sube de version, cambia este numero (ver docs/operations/respaldos.md).
env:
  PG_CLIENT_VERSION: "17"

jobs:
  respaldo:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      BACKUP_OUT_DIR: ${{ github.workspace }}/respaldos

    steps:
      - name: Verificar que el respaldo este configurado
        id: config
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::warning title=Respaldo no configurado::Faltan los secretos BACKUP_DATABASE_URL y/o BACKUP_PASSPHRASE. No se hizo ningun respaldo. Ver docs/operations/respaldos.md"
            echo "configurado=false" >> "$GITHUB_OUTPUT"
          else
            echo "configurado=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.config.outputs.configurado == 'true'

      - name: Instalar cliente de PostgreSQL ${{ env.PG_CLIENT_VERSION }}
        if: steps.config.outputs.configurado == 'true'
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${PG_CLIENT_VERSION}"
          echo "/usr/lib/postgresql/${PG_CLIENT_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Respaldar (pg_dump + cifrado)
        if: steps.config.outputs.configurado == 'true'
        run: bash scripts/respaldo/respaldar.sh

      - name: Subir respaldo cifrado (retencion 30 dias)
        if: steps.config.outputs.configurado == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_id }}
          path: respaldos/respaldo-*.dump.enc
          retention-days: 30
          if-no-files-found: error
